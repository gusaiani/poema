<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Instagram cover (fundo branco): Poema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Instagram video cover: 1080x1920 (9:16). The grid shows a 4:5 crop
     (1080x1350, y 285 to 1635) and some surfaces show 1:1 (1080x1080,
     y 420 to 1500). Everything that matters sits inside the 1:1 zone. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px; overflow: hidden;
    background: #ffffff;
    font-family: 'Inter', -apple-system, sans-serif;
    color: #004E87; position: relative;
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,78,135,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,78,135,0.035) 1px, transparent 1px);
    background-size: 80px 80px; pointer-events: none;
  }
  .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,78,135,0.07) 0%, transparent 70%);
    top: 100px; left: -300px; pointer-events: none; }
  .glow-2 { position: absolute; width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,78,135,0.05) 0%, transparent 70%);
    bottom: 200px; right: -150px; pointer-events: none; }

  .content {
    position: absolute; top: 420px; left: 0; width: 1080px; height: 1080px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0;
  }
  .logo { width: 270px; height: 270px; margin-bottom: 14px; }

  .section-label {
    font-family: 'Inter', sans-serif; font-size: 35px; font-weight: 400;
    color: #5a6f8a; letter-spacing: 5px; text-transform: uppercase;
    text-align: center; margin-bottom: 12px; white-space: nowrap;
  }
  .hero-number {
    font-family: 'DM Serif Display', Georgia, serif; font-size: 176px; font-weight: 400;
    line-height: 1; letter-spacing: -3px; color: #004E87; text-align: center;
  }
  .hero-number .pct { font-size: 88px; letter-spacing: 0; margin-left: 3px; vertical-align: top; position: relative; top: 16px; }
  .vs {
    font-family: 'DM Mono', monospace; font-size: 54px; color: #1a1a1a;
    text-align: center; margin-top: 12px; letter-spacing: 1px;
  }
  .vs span { color: #5a6f8a; font-family: 'Inter', sans-serif; font-size: 37px; letter-spacing: 1px; }

  .divider { width: 80px; height: 2px; background: rgba(0,78,135,0.5); margin: 44px 0 36px; }

  .ytd-number {
    font-family: 'DM Serif Display', Georgia, serif; font-size: 128px; font-weight: 400;
    line-height: 1; letter-spacing: -2px; color: #004E87; text-align: center;
  }
  .ytd-number .pct { font-size: 64px; margin-left: 3px; vertical-align: top; position: relative; top: 11px; }

  .url {
    font-family: 'DM Mono', monospace; font-size: 48px; font-weight: 400;
    color: #004E87; letter-spacing: 4px; margin-top: 40px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow-2"></div>
  <div class="content">
    <img class="logo" src="images/poema-logo.svg" alt="Poema">

    <div class="section-label">Retorno acumulado · jan/2017 a set/2026</div>
    <div class="hero-number">382,73<span class="pct">%</span></div>
    <div class="vs">× 209,40% <span>Ibovespa</span></div>

    <div class="divider"></div>

    <div class="section-label">Resultados 2026 · até o 3º trimestre</div>
    <div class="ytd-number">5,95<span class="pct">%</span></div>
    <div class="vs">× 15,65% <span>Ibovespa</span></div>

    <div class="url">poe.ma</div>
  </div>
</body>
</html>
